name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: offering-protocol/odp-specs
          path: .conformance/odp-specs

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      - name: Run shared conformance harness
        run: pnpm conformance --specs-dir .conformance/odp-specs

      - name: Upload conformance reports
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: odp-node-conformance
          path: .conformance/reports/*.json

      - name: Check Changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && matrix.node == 22
        run: pnpm changeset status --since=origin/main
